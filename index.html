<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot made by Ayan</title>
<style>
  :root{
    --green-900:#0b3d24;
    --green-700:#12603a;
    --green-600:#16814f;
    --green-500:#1fa866;
    --green-100:#e6f5ec;
    --green-050:#f4faf6;
    --white:#ffffff;
    --ink:#0e2318;
    --ink-soft:#4c6459;
    --border:#d8ebe0;
    --shadow: 0 20px 50px -20px rgba(11,61,36,0.35);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display: 'Segoe UI', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-display);
    background:
      radial-gradient(circle at 12% 8%, rgba(31,168,102,0.16), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(18,96,58,0.14), transparent 45%),
      var(--green-050);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:460px;
    height:min(720px, 92vh);
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--border);
    position:relative;
  }

  /* Header */
  .header{
    background: linear-gradient(135deg, var(--green-700), var(--green-500));
    color:var(--white);
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:140px; height:140px;
    background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
    border-radius:50%;
  }
  .avatar{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: inset 0 0 0 2px var(--green-100);
  }
  .avatar svg{width:24px;height:24px;}
  .header-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .header-title{
    font-weight:700;
    font-size:15.5px;
    letter-spacing:0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header-status{
    font-size:12px;
    opacity:0.92;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#8CFFC0;
    box-shadow:0 0 0 3px rgba(140,255,192,0.25);
  }
  .header-actions{margin-left:auto;}
  .clear-btn{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--white);
    font-size:12px;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .clear-btn:hover{background:rgba(255,255,255,0.28);}

  /* Chat body */
  .chat-body{
    flex:1;
    overflow-y:auto;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    background:
      linear-gradient(var(--green-050), var(--white) 220px);
  }
  .chat-body::-webkit-scrollbar{width:8px;}
  .chat-body::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  .msg-row{display:flex; gap:10px; max-width:88%;}
  .msg-row.bot{align-self:flex-start;}
  .msg-row.user{align-self:flex-end; flex-direction:row-reverse;}

  .msg-avatar{
    width:28px;height:28px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .msg-row.bot .msg-avatar{
    background:var(--green-100);
    color:var(--green-700);
  }
  .msg-row.user .msg-avatar{
    background:var(--green-700);
    color:var(--white);
  }

  .bubble{
    padding:11px 14px;
    border-radius:var(--radius-md);
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.bot .bubble{
    background:var(--white);
    border:1px solid var(--border);
    border-top-left-radius:4px;
    color:var(--ink);
  }
  .msg-row.user .bubble{
    background:linear-gradient(135deg, var(--green-600), var(--green-500));
    color:var(--white);
    border-top-right-radius:4px;
  }

  .timestamp{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:4px;
    opacity:0.75;
  }
  .msg-row.user .timestamp{text-align:right;}

  .welcome{
    align-self:center;
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    max-width:80%;
    margin:6px 0 2px;
  }
  .welcome b{color:var(--green-700);}

  /* typing indicator */
  .typing{
    display:flex; gap:4px; align-items:center;
    padding:12px 14px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--green-500);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-5px); opacity:1;}
  }

  /* Input area */
  .input-area{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    background:var(--white);
  }
  .input-wrap{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--green-050);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 8px 6px 16px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap:focus-within{
    border-color:var(--green-500);
    box-shadow:0 0 0 3px rgba(31,168,102,0.15);
  }
  #userInput{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    padding:8px 4px;
    resize:none;
    max-height:100px;
  }
  #userInput::placeholder{color:#8aa79a;}

  .send-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--green-700), var(--green-500));
    color:var(--white);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease, opacity .12s ease;
    box-shadow:0 6px 16px -4px rgba(18,96,58,0.55);
  }
  .send-btn:hover{transform:scale(1.06);}
  .send-btn:active{transform:scale(0.94);}
  .send-btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .send-btn svg{width:17px;height:17px;}

  .footer-credit{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:8px 0 12px;
    letter-spacing:0.2px;
    background:var(--white);
  }
  .footer-credit b{color:var(--green-700);}

  @media (max-width:520px){
    body{padding:0;}
    .app{
      max-width:100%;
      height:100vh;
      border-radius:0;
      border:none;
    }
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3C7.03 3 3 6.58 3 11c0 2.39 1.19 4.53 3.06 5.99-.1.9-.46 2.15-1.4 3.4a.5.5 0 00.5.79c1.98-.5 3.4-1.35 4.24-1.97A11.6 11.6 0 0012 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z" fill="#12603a"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-title">Chatbot made by Ayan</div>
      <div class="header-status"><span class="dot"></span>Online</div>
    </div>
    <div class="header-actions">
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="welcome">You're chatting with <b>Ayan's Chatbot</b>. Ask me anything — I'm here to help.</div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" placeholder="Message Ayan's Chatbot..."></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11.5L20.5 3.5C21.3 3.13 22 3.9 21.6 4.7L14.8 20.6C14.44 21.4 13.3 21.35 13 20.5L11 14.5L5 12.5C4.15 12.2 4.1 11.06 3 11.5Z" fill="currentColor"/>
        <path d="M11 14.5L21.6 4.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="footer-credit">Chatbot made by <b>Ayan</b></div>
</div>

<script>
  // ====== CONFIG ======
  // Paste your n8n "Chat Trigger" Production Webhook URL below.
  // Example: "https://ayankhanfrontend1020.app.n8n.cloud/webhook/xxxxxxxx/chat"
  const WEBHOOK_URL = "https://ayankhanfrontend1020.app.n8n.cloud/webhook/ef651396-fbaa-4d08-b18f-15b82bf63595/chat";
  // =====================

  const chatBody = document.getElementById('chatBody');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  let sessionId = 'session_' + Math.random().toString(36).slice(2) + Date.now();

  function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function addMessage(text, sender){
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = sender === 'bot' ? '🤖' : '🙂';

    const col = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = timeNow();

    col.appendChild(bubble);
    col.appendChild(time);
    row.appendChild(avatar);
    row.appendChild(col);
    chatBody.appendChild(row);
    chatBody.scrollTop = chatBody.scrollHeight;
    return row;
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🤖';
    const bubbleWrap = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    bubbleWrap.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(bubbleWrap);
    chatBody.appendChild(row);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function hideTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  async function sendMessage(){
    const text = userInput.value.trim();
    if(!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    autoGrow();
    sendBtn.disabled = true;
    showTyping();

    if(WEBHOOK_URL === "YOUR_N8N_WEBHOOK_URL_HERE"){
      setTimeout(() => {
        hideTyping();
        addMessage("Webhook URL isn't set yet. Open this file and replace the WEBHOOK_URL variable with your n8n chat webhook.", 'bot');
        sendBtn.disabled = false;
      }, 600);
      return;
    }

    try{
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chatInput: text,
          sessionId: sessionId
        })
      });

      if(!res.ok) throw new Error('Request failed: ' + res.status);

      const data = await res.json();
      const reply = data.output || data.text || data.reply || JSON.stringify(data);

      hideTyping();
      addMessage(reply, 'bot');
    }catch(err){
      hideTyping();
      addMessage("Sorry, I couldn't get a response. (" + err.message + ")", 'bot');
    }finally{
      sendBtn.disabled = false;
    }
  }

  function autoGrow(){
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
  }

  userInput.addEventListener('input', autoGrow);
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  clearBtn.addEventListener('click', () => {
    chatBody.innerHTML = '<div class="welcome">You\'re chatting with <b>Ayan\'s Chatbot</b>. Ask me anything — I\'m here to help.</div>';
    sessionId = 'session_' + Math.random().toString(36).slice(2) + Date.now();
  });
</script>

</body>
</html>
