<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<style>
  :root{
    --bk-900:#000000;
    --bk-700:#1a1a1a;
    --bk-600:#2b2b2b;
    --bk-500:#3d3d3d;
    --gray-100:#f2f2f2;
    --gray-050:#fafafa;
    --white:#ffffff;
    --ink:#111111;
    --ink-soft:#6f6f6f;
    --border:#e2e2e2;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font);
    background:var(--white);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .brand-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--bk-900);
    box-shadow:0 0 0 3px rgba(0,0,0,0.12);
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{background:var(--gray-050); color:var(--bk-900);}
  .icon-btn svg{width:17px;height:17px;}

  /* Chat area */
  .chat-scroll{
    flex:1;
    overflow-y:auto;
  }
  .chat-inner{
    max-width:720px;
    margin:0 auto;
    padding:32px 20px 140px;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }

  /* Empty state */
  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding-bottom:80px;
  }
  .empty-orb{
    width:56px;height:56px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--bk-700), var(--bk-500));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .empty-orb svg{width:28px;height:28px;color:#fff;}
  .empty-title{
    font-size:22px;
    font-weight:600;
    color:var(--ink);
  }
  .empty-sub{
    font-size:14px;
    color:var(--ink-soft);
    max-width:360px;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:10px;
    max-width:460px;
  }
  .suggestion-chip{
    border:1px solid var(--border);
    background:var(--white);
    color:var(--ink);
    font-size:13px;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .suggestion-chip:hover{
    border-color:var(--bk-900);
    background:var(--gray-050);
  }

  /* Messages */
  .msg{
    display:flex;
    gap:14px;
    padding:18px 0;
    align-items:flex-start;
  }
  .msg-avatar{
    width:30px;height:30px;
    border-radius:8px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .msg.assistant .msg-avatar{
    background:linear-gradient(135deg, var(--bk-700), var(--bk-500));
    color:#fff;
  }
  .msg.user .msg-avatar{
    background:var(--ink);
    color:#fff;
  }
  .msg-content{
    flex:1;
    min-width:0;
  }
  .msg-role{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .msg-text{
    font-size:15px;
    line-height:1.65;
    white-space:pre-wrap;
    word-wrap:break-word;
    color:var(--ink);
  }
  .msg-text code{
    background:var(--gray-100);
    color:var(--bk-700);
    padding:1px 6px;
    border-radius:5px;
    font-size:13.5px;
    font-family:'Consolas', 'Courier New', monospace;
  }

  .msg.user{
    justify-content:flex-end;
  }
  .msg.user .msg-content{
    flex:none;
    max-width:80%;
  }
  .msg.user .msg-text{
    background:var(--gray-100);
    color:var(--ink);
    padding:10px 14px;
    border-radius:14px 14px 4px 14px;
  }
  .msg.user .msg-role{
    text-align:right;
  }

  .typing-dots{
    display:flex; gap:4px; align-items:center;
    padding:6px 0;
  }
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--bk-700);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-5px); opacity:1;}
  }

  /* Input dock */
  .input-dock{
    position:fixed;
    bottom:0; left:0; right:0;
    padding:16px 20px 22px;
    background:linear-gradient(to top, var(--white) 60%, rgba(255,255,255,0));
  }
  .input-shell{
    max-width:720px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:24px;
    padding:8px 8px 8px 18px;
    box-shadow:0 8px 30px -12px rgba(0,0,0,0.12);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-shell:focus-within{
    border-color:var(--bk-900);
    box-shadow:0 8px 30px -12px rgba(0,0,0,0.35);
  }
  #userInput{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    padding:9px 4px;
    resize:none;
    max-height:160px;
    line-height:1.5;
  }
  #userInput::placeholder{color:#9a9a9a;}

  .send-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--white);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .12s ease, opacity .15s ease;
  }
  .send-btn:not(:disabled):hover{background:var(--bk-600); transform:scale(1.05);}
  .send-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .send-btn svg{width:16px;height:16px;}

  .chat-scroll::-webkit-scrollbar{width:8px;}
  .chat-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  @media (max-width:600px){
    .chat-inner{padding:20px 14px 140px;}
    .empty-title{font-size:19px;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      Chatbot
    </div>
    <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner">
      <div class="empty-state" id="emptyState">
        <div class="empty-orb">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3C7.03 3 3 6.58 3 11c0 2.39 1.19 4.53 3.06 5.99-.1.9-.46 2.15-1.4 3.4a.5.5 0 00.5.79c1.98-.5 3.4-1.35 4.24-1.97A11.6 11.6 0 0012 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z" fill="currentColor"/>
          </svg>
        </div>
        <div class="empty-title">How can I help you today?</div>
        <div class="empty-sub">Ask a question, brainstorm ideas, or just say hi.</div>
        <div class="suggestions">
          <button class="suggestion-chip" data-prompt="Give me 3 ideas for a weekend project">Weekend project ideas</button>
          <button class="suggestion-chip" data-prompt="Explain this like I'm new to it:">Explain something</button>
          <button class="suggestion-chip" data-prompt="Help me write a message about:">Help me write</button>
        </div>
      </div>
      <div id="messages"></div>
    </div>
  </div>

  <div class="input-dock">
    <div class="input-shell">
      <textarea id="userInput" rows="1" placeholder="Message..."></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

<script>
  // ====== CONFIG ======
  // Paste your n8n "Chat Trigger" Production Webhook URL below.
  const WEBHOOK_URL = "https://ayankhanfrontend1020.app.n8n.cloud/webhook/ef651396-fbaa-4d08-b18f-15b82bf63595/chat";
  // =====================

  const STORAGE_KEY = 'chatbot_history_v1';
  const SESSION_KEY = 'chatbot_session_v1';

  const chatScroll = document.getElementById('chatScroll');
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');

  let sessionId = localStorage.getItem(SESSION_KEY);
  if(!sessionId){
    sessionId = 'session_' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  let history = [];
  try{
    history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){ history = []; }

  function saveHistory(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatMarkdown(text){
    let safe = escapeHtml(text);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    safe = safe.replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g, '$1<i>$2</i>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/^(?:-|\*)\s+(.*)$/gm, '• $1');
    return safe;
  }

  function updateEmptyState(){
    emptyState.style.display = history.length ? 'none' : 'flex';
  }

  function renderMessage(role, text){
    const row = document.createElement('div');
    row.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'assistant' ? '🤖' : '🙂';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const roleLabel = document.createElement('div');
    roleLabel.className = 'msg-role';
    roleLabel.textContent = role === 'assistant' ? 'Chatbot' : 'You';

    const textEl = document.createElement('div');
    textEl.className = 'msg-text';
    if(role === 'assistant'){
      textEl.innerHTML = formatMarkdown(text);
    } else {
      textEl.textContent = text;
    }

    content.appendChild(roleLabel);
    content.appendChild(textEl);

    if(role === 'assistant'){
      row.appendChild(avatar);
      row.appendChild(content);
    } else {
      row.appendChild(content);
      row.appendChild(avatar);
    }

    messagesEl.appendChild(row);
    return row;
  }

  function scrollToBottom(){
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function renderAll(){
    messagesEl.innerHTML = '';
    history.forEach(m => renderMessage(m.role, m.text));
    updateEmptyState();
    scrollToBottom();
  }

  function addMessage(role, text){
    history.push({ role, text });
    saveHistory();
    renderMessage(role, text);
    updateEmptyState();
    scrollToBottom();
  }

  let typingRow = null;
  function showTyping(){
    typingRow = document.createElement('div');
    typingRow.className = 'msg assistant';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🤖';
    const content = document.createElement('div');
    content.className = 'msg-content';
    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    content.appendChild(dots);
    typingRow.appendChild(avatar);
    typingRow.appendChild(content);
    messagesEl.appendChild(typingRow);
    scrollToBottom();
  }
  function hideTyping(){
    if(typingRow){ typingRow.remove(); typingRow = null; }
  }

  async function sendMessage(){
    const text = userInput.value.trim();
    if(!text) return;

    addMessage('user', text);
    userInput.value = '';
    autoGrow();
    updateSendState();
    showTyping();

    if(WEBHOOK_URL === "YOUR_N8N_WEBHOOK_URL_HERE"){
      setTimeout(() => {
        hideTyping();
        addMessage('assistant', "Webhook URL isn't set yet. Open this file and replace the WEBHOOK_URL variable with your n8n chat webhook.");
      }, 500);
      return;
    }

    try{
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'sendMessage',
          chatInput: text,
          sessionId: sessionId
        })
      });

      if(!res.ok) throw new Error('Request failed: ' + res.status);

      const data = await res.json();
      const reply = data.output || data.text || data.reply || JSON.stringify(data);

      hideTyping();
      addMessage('assistant', reply);
    }catch(err){
      hideTyping();
      addMessage('assistant', "Sorry, I couldn't get a response. (" + err.message + ")");
    }
  }

  function autoGrow(){
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  }

  function updateSendState(){
    sendBtn.disabled = userInput.value.trim().length === 0;
  }

  userInput.addEventListener('input', () => { autoGrow(); updateSendState(); });
  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if(!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  newChatBtn.addEventListener('click', () => {
    history = [];
    saveHistory();
    sessionId = 'session_' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem(SESSION_KEY, sessionId);
    renderAll();
  });

  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      userInput.value = chip.getAttribute('data-prompt') + ' ';
      autoGrow();
      updateSendState();
      userInput.focus();
    });
  });

  renderAll();
</script>

</body>
</html>
